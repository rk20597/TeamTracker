<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
          initial-scale=1.0">
    <title>Team Tracker — Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, 
                Geneva, Verdana, sans-serif;
            background: linear-gradient(
                135deg, #1a1a2e 0%, 
                #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px 
                rgba(0, 0, 0, 0.3);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-section h1 {
            color: #0f3460;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .logo-section p {
            color: #666;
            font-size: 14px;
        }

        .deloitte-bar {
            height: 4px;
            background: linear-gradient(
                90deg, #86bc25, #0f3460);
            border-radius: 2px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0f3460;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(
                135deg, #0f3460, #16213e);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 15px;
        }

        .footer-text {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-section">
            <h1>Team Tracker</h1>
            <p>Please sign in to continue</p>
        </div>
        <div class="deloitte-bar"></div>

        <div class="form-group">
            <label for="username">Username</label>
            <input 
                type="text" 
                id="username" 
                placeholder="Enter your username"
                autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password">
        </div>

        <button 
            class="btn-login" 
            id="loginBtn" 
            onclick="login()">
            Sign In
        </button>

        <div class="error-message" id="errorMsg">
            Invalid username or password
        </div>

        <div class="loading" id="loading">
            Signing in...
        </div>

        <div class="footer-text">
            HR Onboarding Management System v1.0
        </div>
    </div>

    <script>
        document.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') login();
});

function login() {
    const username = document
        .getElementById('username').value;
    const password = document
        .getElementById('password').value;

    // Check username empty
    if (!username) {
        showError('Please enter your username');
        return;
    }

    // Check @deloitte.com
    if (!username.endsWith('@deloitte.com')) {
        showError('Username must be a valid Deloitte email address ending with @deloitte.com');
        return;
    }

    // Check password empty
    if (!password) {
        showError('Please enter your password');
        return;
    }

    // Password rules
    if (password.length < 8) {
        showError('Password must be at least 8 characters');
        return;
    }

    if (!/[A-Z]/.test(password)) {
        showError('Password must contain at least one uppercase letter');
        return;
    }

    if (!/[0-9]/.test(password)) {
        showError('Password must contain at least one number');
        return;
    }

    if (!/[!@#$%^&*]/.test(password)) {
        showError('Password must contain at least one special character');
        return;
    }

    // Call API
    fetch('http://localhost:5289/api/auth/login', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(function(response) {
        if (!response.ok) {
            throw new Error('Login failed');
        }
        return response.json();
    })
    .then(function(data) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('role', data.role);
        localStorage.setItem('username', data.username);

        window.location.href = 'dashboard.html';

    })
    .catch(function(error) {
        showError('Invalid username or password');
    });
}

function showError(message) {
    var err = document.getElementById('errorMsg');
    err.textContent = message;
    err.style.display = 'block';
}

    </script>
</body>
</html>
